<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" role="img" aria-label="Logo Resmi MOCHI">
  <title>MOCHI - Repositori Keputusan Bahtsul Masail</title>
  <defs>
    <linearGradient id="primaryGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A46" />
      <stop offset="50%" stop-color="#1E3F30" />
      <stop offset="100%" stop-color="#12241B" />
    </linearGradient>
    <linearGradient id="goldGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5CE98" />
      <stop offset="50%" stop-color="#C9A96E" />
      <stop offset="100%" stop-color="#A88344" />
    </linearGradient>
  </defs>

  <!-- Simbol Khatam Musyawarah 96x96 di Kiri -->
  <g transform="translate(14, 12) scale(0.375)">
    <rect x="40" y="40" width="176" height="176" rx="28" fill="url(#primaryGradH)" />
    <rect x="40" y="40" width="176" height="176" rx="28" fill="url(#primaryGradH)" transform="rotate(45 128 128)" />
    <circle cx="128" cy="128" r="84" stroke="url(#goldGradH)" stroke-width="3" fill="none" opacity="0.85" />
    <!-- 8 Diamonds -->
    <g transform="translate(198, 128) rotate(90)"><polygon points="0,-10 5,0 0,10 -5,0" fill="url(#goldGradH)" /></g>
    <g transform="translate(177.5, 177.5) rotate(135)"><polygon points="0,-10 5,0 0,10 -5,0" fill="url(#goldGradH)" /></g>
    <g transform="translate(128, 198) rotate(180)"><polygon points="0,-10 5,0 0,10 -5,0" fill="url(#goldGradH)" /></g>
    <g transform="translate(78.5, 177.5) rotate(225)"><polygon points="0,-10 5,0 0,10 -5,0" fill="url(#goldGradH)" /></g>
    <g transform="translate(58, 128) rotate(270)"><polygon points="0,-10 5,0 0,10 -5,0" fill="url(#goldGradH)" /></g>
    <g transform="translate(78.5, 78.5) rotate(315)"><polygon points="0,-10 5,0 0,10 -5,0" fill="url(#goldGradH)" /></g>
    <g transform="translate(128, 58) rotate(0)"><polygon points="0,-10 5,0 0,10 -5,0" fill="url(#goldGradH)" /></g>
    <g transform="translate(177.5, 78.5) rotate(45)"><polygon points="0,-10 5,0 0,10 -5,0" fill="url(#goldGradH)" /></g>
    <circle cx="128" cy="128" r="54" fill="#142A1F" stroke="url(#goldGradH)" stroke-width="3.5" />
    <path d="M 125 146 C 111 137, 95 137, 84 144 L 84 116 C 95 110, 111 110, 125 118 Z" fill="#FAF5E8" />
    <path d="M 131 146 C 145 137, 161 137, 172 144 L 172 116 C 161 110, 145 110, 131 118 Z" fill="#FAF5E8" />
    <line x1="128" y1="114" x2="128" y2="148" stroke="url(#goldGradH)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="128" cy="101" r="3.8" fill="url(#goldGradH)" />
  </g>

  <!-- Wordmark Belogo Stencil Heritage & Subtitle -->
  <g transform="translate(128, 16)">
    <!-- Wordmark MOCHI Vector (Height: 44px) -->
    <g transform="scale(0.9167)">
      <!-- M -->
      <path d="M 0 0 L 8.5 0 L 8.5 48 L 0 48 Z" fill="#1E3F30" />
      <path d="M 39.5 0 L 48 0 L 48 48 L 39.5 48 Z" fill="#1E3F30" />
      <path d="M 7.5 2 L 15.5 2 L 24 37 L 17 37 Z" fill="#1E3F30" />
      <path d="M 40.5 2 L 32.5 2 L 24 37 L 31 37 Z" fill="#1E3F30" />
      <!-- O Belogo Stencil -->
      <g transform="translate(58, 0)">
        <path d="M 21 0 A 24 24 0 0 0 21 48 L 21 39.5 A 15.5 15.5 0 0 1 21 8.5 Z" fill="#1E3F30" />
        <path d="M 27 0 A 24 24 0 0 1 27 48 L 27 39.5 A 15.5 15.5 0 0 0 27 8.5 Z" fill="#1E3F30" />
      </g>
      <!-- C -->
      <g transform="translate(116, 0)">
        <path d="M 40 10 A 24 24 0 1 0 40 38 L 33 33 A 15.5 15.5 0 1 1 33 15 Z" fill="#1E3F30" />
      </g>
      <!-- H -->
      <g transform="translate(166, 0)">
        <rect x="0" y="0" width="8.5" height="48" fill="#1E3F30" />
        <rect x="31.5" y="0" width="8.5" height="48" fill="#1E3F30" />
        <rect x="8.5" y="19.75" width="23" height="8.5" fill="#1E3F30" />
      </g>
      <!-- I with Amber Gold Turats Diamond Pip -->
      <g transform="translate(216, 0)">
        <rect x="4" y="14" width="8.5" height="34" fill="#1E3F30" />
        <polygon points="8.25,0 13.5,6.5 8.25,13 3,6.5" fill="#C9A96E" />
      </g>
    </g>

    <!-- Subtitle (Tanpa Badge Abu-abu!) -->
    <text x="2" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="-0.1" fill="#4B6B59">Repositori Keputusan Bahtsul Masail</text>
    <text x="2" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.1" fill="#8C867E">Masail Online &amp; Comprehensive Heritage Intelligence</text>
  </g>
</svg>